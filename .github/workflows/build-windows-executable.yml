name: Build Windows executable

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      - name: Install dependencies
        run: uv sync --extra full

      - name: Build executable
        shell: pwsh
        run: |
          uv run pyinstaller --clean --onefile `
            --add-data "src/pswamp;pswamp" `
            --add-data "examples/nordic44_rtsim/data;data" `
            --add-data "examples/nordic44_rtsim/config.toml;." `
            examples/nordic44_rtsim/run_case.py

      - name: Attest executable provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/run_case.exe

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: nordic44_rtsim-run_case-windows
          path: dist/run_case.exe
          compression-level: 0
          if-no-files-found: error

      - name: Attach executable to release
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/run_case.exe#nordic44_rtsim-run_case-windows.exe" --clobber
