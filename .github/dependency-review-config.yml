# Dependency Review evaluates dependencies added or changed by a pull request.
# Keep this list intentionally narrow; licenses outside it require an explicit
# policy decision rather than silently becoming accepted precedent.
fail-on-severity: high
fail-on-scopes:
  - runtime

vulnerability-check: true
license-check: true
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC0-1.0
  - ISC
  - MIT
  - MIT-0
  - OFL-1.1
  - PSF-2.0
  - Python-2.0
  - Unlicense
  - Zlib

# Results remain in the check log and job summary, so the workflow needs no
# pull-request write permission.
comment-summary-in-pr: never
